name: apitest
on: { workflow_dispatch: {} }
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in \
            "https://www.eapharma.co.jp/medicalexpert/supply/" \
            "https://med.sawai.co.jp/products/supply/" \
            "https://med.towayakuhin.co.jp/medical/product/information_supply.php" \
            "https://www.nichiiko.co.jp/medicine/supply/" \
            "https://www.nihon-generic.co.jp/medical/supply/" \
            "https://www.meiji-seika-pharma.co.jp/medical/supply/" \
            "https://www.nipro.co.jp/medical_topics/" \
            "https://www.kyowakirin.co.jp/medical/supply/" \
            "https://www.takeda.com/ja-jp/what-we-do/product-information/supply/" \
            "https://www.mochida.co.jp/dis/supply/" \
            "https://www.mhlw.go.jp/stf/seisakunitsuite/bunya/kenkou_iryou/iryou/kouhatu-iyaku/04_00003.html" \
            "https://www.jga.gr.jp/" ; do
            printf "%s " "$u"; curl -sS -o /dev/null -L -m 20 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -w "%{http_code} %{size_download}\n" "$u" || echo ERR
          done
