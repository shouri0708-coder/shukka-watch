name: update
on:
  schedule:
    - cron: "0 0,3,6,9 * * 1-5"   # UTC → JST 9,12,15,18時（平日）
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: update
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl requests beautifulsoup4
      - run: python fetch.py
      - run: python makers.py || true
      - run: python build.py
      - name: commit
        run: |
          git config user.name "shukka-watch bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs state.json history.json makers_state.json makers_log.txt
          git diff --cached --quiet && echo "no change" || (git commit -m "update $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
