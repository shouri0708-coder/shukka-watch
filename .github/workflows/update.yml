name: update
on:
  schedule:
    - cron: "23 23,1,3,5,7,9,11,13 * * *"   # UTC → JST 8:23,10:23,…,22:23（毎日。0分は混雑で飛ぶため23分）
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency: update
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl requests beautifulsoup4
      - run: python fetch.py
      - run: python makers.py || true
      - run: python build.py
      - name: commit
        run: |
          git config user.name "shukka-watch bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data docs state.json history.json makers_state.json makers_log.txt
          git diff --cached --quiet && echo "no change" || (git commit -m "update $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
