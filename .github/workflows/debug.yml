name: debug
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && playwright install --with-deps chromium
      - run: mkdir -p debug && python tools/towa_fetch.py debug/towa.xlsx
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add -f debug && git commit -m "debug towa" && git pull --rebase --autostash && git push
