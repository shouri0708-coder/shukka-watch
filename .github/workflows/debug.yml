name: debug
on: { workflow_dispatch: {} }
jobs:
  d:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p debug
          for x in "ea https://www.eapharma.co.jp/medical/news" "jg https://medical.nihon-generic.co.jp/news/" "sawai https://med.sawai.co.jp/con_list.php" "dsep https://med.daiichisankyo-ep.co.jp/information/?distribution&certification=1" "kyorin https://www.med.kyorin-rmd.com/news/"; do
            set -- $x; curl -sSL -m 30 -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/128.0 Safari/537.36" -o debug/$1.html "$2" || true
          done
          ls -la debug
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add debug && git commit -m "debug html" && git push
